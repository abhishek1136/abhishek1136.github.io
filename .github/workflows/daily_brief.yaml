name: Daily Morning Brief

on:
  schedule:
    # 8:30 AM IST = 3:00 AM UTC
    - cron: '0 3 * * 1-5'

  # Run manually anytime from GitHub Actions tab
  workflow_dispatch:

jobs:
  run-brief:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance pandas ta anthropic

      - name: Run stock analysis agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          cd market
          python stock_brief.py

      - name: Commit and push data.json
        run: |
          git config user.name  "Stock Agent Bot"
          git config user.email "abhi.nath1136@gmail.com"
          git add market/data.json
          git diff --staged --quiet || git commit -m "Auto brief - $(date +'%Y-%m-%d')"
          git push
