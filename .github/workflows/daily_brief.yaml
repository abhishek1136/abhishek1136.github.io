name: Daily Morning Brief

on:
  # Triggered externally by cron-job.org at 8:00 AM IST (2:30 AM UTC) Mon-Fri
  # Do NOT re-enable the schedule block below — cron-job.org is more reliable
  workflow_dispatch:

jobs:
  run-brief:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance pandas ta anthropic

      - name: Run stock analysis agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          cd market
          python stock_brief.py

      - name: Commit and push data.json
        run: |
          git config user.name  "Stock Agent Bot"
          git config user.email "abhi.nath1136@gmail.com"
          git add market/data.json
          git diff --staged --quiet || git commit -m "Auto brief - $(date +'%Y-%m-%d')"
          git push
